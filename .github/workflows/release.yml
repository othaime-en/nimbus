name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: nimbus

jobs:
  checks:
    name: Pre-release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features --verbose

  build:
    name: Build (${{ matrix.target }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          STAGE_DIR="${BIN_NAME}-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"

          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$STAGE_DIR/"
          cp README.md LICENSE config.example.toml "$STAGE_DIR/"

          ARCHIVE="${STAGE_DIR}.tar.gz"
          tar -czf "$ARCHIVE" "$STAGE_DIR"
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          if ($version -notlike 'v*') {
            $version = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }

          $stageDir = "$env:BIN_NAME-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stageDir | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" $stageDir
          Copy-Item README.md,LICENSE,config.example.toml $stageDir

          $archive = "$stageDir.zip"
          Compress-Archive -Path $stageDir -DestinationPath $archive

          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"

          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE=$archive"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  build-macos:
    name: Build macOS (arm64 native + x86_64 cross-compiled)
    needs: checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # macos-14 runners are Apple Silicon (arm64). Rather than also
      # requesting a separate x86_64 (Intel) macOS runner — a much
      # smaller, often congested pool that can leave a run queued for
      # hours — we build the x86_64 binary here too. Apple's clang/ld64
      # is a universal toolchain that links x86_64 output natively on an
      # arm64 host, so this needs no cross-linker setup beyond adding the
      # Rust target.
      - name: Install Rust (both macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-multi-target

      - name: Build native arm64 binary
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Cross-compile x86_64 binary
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Package both archives
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            STAGE_DIR="${BIN_NAME}-${VERSION}-${target}"
            mkdir -p "$STAGE_DIR"

            cp "target/${target}/release/${BIN_NAME}" "$STAGE_DIR/"
            cp README.md LICENSE config.example.toml "$STAGE_DIR/"

            ARCHIVE="${STAGE_DIR}.tar.gz"
            tar -czf "$ARCHIVE" "$STAGE_DIR"
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-macos-all
          path: |
            ${{ env.BIN_NAME }}-*-aarch64-apple-darwin.tar.gz
            ${{ env.BIN_NAME }}-*-aarch64-apple-darwin.tar.gz.sha256
            ${{ env.BIN_NAME }}-*-x86_64-apple-darwin.tar.gz
            ${{ env.BIN_NAME }}-*-x86_64-apple-darwin.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract changelog section for this version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ ("\\[" ver "\\]")) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::error::No '## [$VERSION]' section found in CHANGELOG.md. Add one before tagging a release."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
