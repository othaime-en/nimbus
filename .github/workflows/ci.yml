name: CI

on:
  push: # runs on every branch, so you get feedback before opening a PR
  pull_request:
    branches: [main]

# Cancel older runs on the same branch if you push again before CI finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Add macos-latest here too if you want release-build confidence
        # ahead of actually cutting a release.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Caches ~/.cargo and target/, keyed on the matrix OS + Cargo.lock.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      # Informational only for now -- doesn't fail the build. We'll flip this to
      # `cargo clippy --all-targets --all-features -- -D warnings` once
      # we've cleared any existing warnings and want it enforced.
      - name: Clippy (non-blocking)
        run: cargo clippy --all-targets --all-features
        continue-on-error: true
